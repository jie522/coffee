<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF4EE">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>豆豆手沖帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a phone-sized app column — header, scrolling view, fixed bottom tab bar. Soft "strawberry milk + cocoa" café palette. */
:root{
  --bg:#FFF4EE; --surface:#FFFFFF; --surface-2:#FFE9DF; --ink:#4A2C22; --ink-soft:#8C6A5E;
  --line:#F2D6CB; --accent:#FF7A93; --accent-soft:#FFE0E6; --accent-ink:#FFFFFF;
  --mint:#5FBFA3; --mint-soft:#DDF4EC; --butter:#FFD36E; --butter-soft:#FFF3D1;
  --shadow:0 6px 18px rgba(122,62,40,.10);
  --f-display:"Huninn","Zen Maru Gothic","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Fredoka","Huninn",ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#231714; --surface:#31221D; --surface-2:#3D2B24; --ink:#FBE9E1; --ink-soft:#C9A99C;
  --line:#4D362D; --accent:#FF8FA4; --accent-soft:#4A2A30; --accent-ink:#2A1512;
  --mint:#6CC9AE; --mint-soft:#23392F; --butter:#F2C35A; --butter-soft:#3E3320;
  --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#231714; --surface:#31221D; --surface-2:#3D2B24; --ink:#FBE9E1; --ink-soft:#C9A99C;
  --line:#4D362D; --accent:#FF8FA4; --accent-soft:#4A2A30; --accent-ink:#2A1512;
  --mint:#6CC9AE; --mint-soft:#23392F; --butter:#F2C35A; --butter-soft:#3E3320;
  --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
.app{max-width:520px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:26px} h2{font-size:20px} h3{font-size:17px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:18px 6px}
.top .t{flex:1;min-width:0}
.setup{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px;color:var(--ink-soft);white-space:nowrap}
.chip.pink{background:var(--accent-soft);color:var(--ink)}
.chip.mint{background:var(--mint-soft);color:var(--ink)}
.chip.butter{background:var(--butter-soft);color:var(--ink)}
.iconbtn{border:0;background:var(--surface);border-radius:14px;width:42px;height:42px;display:grid;place-items:center;box-shadow:var(--shadow);font-size:18px}

/* knowledge card */
.tip{background:var(--butter-soft);border-radius:22px;padding:16px 16px 14px;position:relative;overflow:hidden}
.tip .lab{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;color:var(--ink-soft)}
.tip p{margin:6px 0 8px}
.tip .more{border:0;background:transparent;padding:0;color:var(--ink);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.tip svg.deco{position:absolute;right:-8px;bottom:-10px;opacity:.9}

/* search */
.search{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;outline:none}
.search:focus{border-color:var(--accent)}

/* bean card */
.bean{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:22px;padding:12px 14px;box-shadow:var(--shadow);border:0;text-align:left;width:100%}
.bean .info{flex:1;min-width:0}
.bean .name{font-family:var(--f-display);font-size:17px;overflow-wrap:anywhere}
.bean .meta{font-size:12.5px;color:var(--ink-soft);overflow-wrap:anywhere}
.bean .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bean .go{color:var(--ink-soft);font-size:20px}
.example{font-size:11px;background:var(--mint-soft);color:var(--ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-family:var(--f-body)}

.empty{text-align:center;padding:28px 12px;background:var(--surface);border-radius:22px;border:2px dashed var(--line)}
.empty p{margin:8px 0 0}

/* FAB + buttons */
.btn{border:0;border-radius:16px;padding:11px 18px;background:var(--surface-2);font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.mint{background:var(--mint);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.danger{background:transparent;color:#D94A5F;border:2px solid currentColor}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:13px 20px;font-family:var(--f-display);font-size:16px;box-shadow:0 8px 20px rgba(255,90,120,.35);z-index:5}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:6}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:0;background:transparent;border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;color:var(--ink-soft)}
.tab .ic{font-size:20px;line-height:1.1;font-family:var(--f-display)}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}

/* detail */
.back{border:0;background:transparent;padding:14px 0 4px;color:var(--ink-soft)}
.hero{display:flex;gap:14px;align-items:center}
.hero .t{min-width:0;flex:1}
.hero h1{overflow-wrap:anywhere}
.params{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.param{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.param .k{font-size:12px;color:var(--ink-soft)}
.param .v{font-family:var(--f-num);font-size:24px;font-weight:600;line-height:1.2}
.param .v small{font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:2px}
.param .s{font-size:12px;color:var(--ink-soft)}
.param.big{grid-column:1/-1;background:var(--accent-soft);box-shadow:none}
.section{display:flex;flex-direction:column;gap:10px}
.section > h2{display:flex;align-items:center;gap:8px}
.note{background:var(--surface);border-radius:18px;padding:12px 14px;font-size:14px}
.note ul{margin:0;padding-left:1.1em}
.note li+li{margin-top:4px}

.step{background:var(--surface);border-radius:20px;padding:14px;display:grid;grid-template-columns:40px 1fr;gap:4px 12px;box-shadow:var(--shadow)}
.step .n{grid-row:1/span 3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:17px;background:var(--butter);color:#4A2C22}
.step:nth-child(2) .n{background:var(--mint);color:#fff}
.step:nth-child(n+3) .n{background:var(--accent);color:var(--accent-ink)}
.step .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.step .hd h3{font-size:16px}
.step .tm{font-family:var(--f-num);font-size:13px;color:var(--ink-soft)}
.step .w{font-size:13.5px}
.step .w b{font-family:var(--f-num);font-weight:600;font-size:15px}
.step .how{font-size:13.5px;margin:2px 0 0}
.step .why{font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border-radius:10px;padding:5px 9px;margin-top:4px}

.flav{background:var(--surface);border-radius:20px;padding:4px 14px}
.flav .r{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.flav .r:last-child{border:0}
.flav .r .k{font-family:var(--f-display);font-size:13.5px}
.flav .r .k small{display:block;font-family:var(--f-body);font-size:11px;color:var(--ink-soft);letter-spacing:.04em}
.dial{display:grid;gap:10px}
.dial .d{border-radius:18px;padding:12px 14px;font-size:14px}
.dial .d.u{background:var(--mint-soft)} .dial .d.o{background:var(--accent-soft)}
.dial .d b{font-family:var(--f-display);font-weight:400;display:block;margin-bottom:2px}

.log{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.log .lh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cups{letter-spacing:1px}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field > span{font-size:13px;color:var(--ink-soft)}
.inp{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;outline:none;min-width:0}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:76px;resize:vertical}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.status{font-size:13.5px;border-radius:14px;padding:10px 12px;background:var(--surface-2)}
.status.err{background:var(--accent-soft)}

/* timer */
.clock{text-align:center;padding:18px 10px 14px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow)}
.clock .big{font-family:var(--f-num);font-size:64px;font-weight:600;line-height:1}
.clock .cur{font-family:var(--f-display);font-size:20px;margin-top:10px}
.clock .tgt{font-size:15px;margin-top:2px}
.clock .tgt b{font-family:var(--f-num);font-size:30px;color:var(--accent)}
.bar{display:flex;gap:4px;margin-top:14px;height:12px}
.bar i{flex:1;border-radius:6px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i span{position:absolute;inset:0;width:0;background:var(--mint);border-radius:6px}
.nextup{font-size:13.5px;color:var(--ink-soft);margin-top:10px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(40,20,14,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;max-height:88%;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.cupsel{display:flex;gap:6px}
.cupsel button{border:0;background:var(--surface-2);border-radius:12px;width:44px;height:44px;font-size:20px}
.cupsel button[aria-pressed="true"]{background:var(--butter)}

.kn{background:var(--surface);border-radius:20px;padding:14px 16px}
.kn .tag{font-size:11.5px;letter-spacing:.06em}
.kn h3{margin:4px 0 4px}
.kn p{margin:0;font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20}

@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.wob{animation:wob 2.4s ease-in-out infinite;transform-origin:50% 80%}
@media (prefers-reduced-motion:reduce){.wob{animation:none}}
</style>

<div class="app" id="app"></div>
<nav class="tabs" aria-label="主要分頁"><div class="in">
  <button class="tab" id="tab-home" data-tab="home"><span class="ic">◍</span>豆櫃</button>
  <button class="tab" id="tab-timer" data-tab="timer"><span class="ic">◷</span>沖煮計時</button>
  <button class="tab" id="tab-know" data-tab="know"><span class="ic">✎</span>咖啡知識</button>
</div></nav>
<div id="layer"></div>

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const DOSE = 30;
const ROASTS = ["淺焙","淺中焙","中焙","中深焙","深焙"];
const ROAST_COLOR = {"淺焙":"#D19A66","淺中焙":"#B47546","中焙":"#8F5635","中深焙":"#6E3D25","深焙":"#4B2719"};
const PROCESSES = ["水洗","日曬","蜜處理","厭氧","濕剝","其他"];

const KNOW = [
  {tag:"器具",t:"紅軸每響只有 15 微米",p:"Red Clix 每響約 15μm，是原廠軸心（約 30μm）的一半。原廠 26 格 ≈ 紅軸 52 響，對照時把格數乘 2 就好。"},
  {tag:"器具",t:"玻璃濾杯一定要預熱",p:"玻璃比熱容高、吸熱快，沒預熱的話水溫一進杯就掉 3–5°C，酸質會變尖、萃取不足。熱水沖燙 15–20 秒再倒掉。"},
  {tag:"萃取",t:"悶蒸在做什麼？",p:"新鮮咖啡粉裡有大量二氧化碳，會把水推開。悶蒸讓氣體先排出，後面的水才進得去。粉量約 2–2.5 倍的水最剛好。"},
  {tag:"萃取",t:"酸、甜、苦的出場順序",p:"萃取時酸先出來、甜居中、苦澀最後。所以第三段要「截斷」：水位快見粉層就移開濾杯，把木質澀味留在濾杯裡。"},
  {tag:"萃取",t:"SCA 金杯標準",p:"理想萃取率約 18–22%，濃度 TDS 約 1.15–1.35%。太低偏酸寡淡，太高就苦澀乾口。"},
  {tag:"萃取",t:"先動研磨，再動水溫",p:"味道不對時一次只改一個變數。研磨影響最大，先調 2–3 響；還不夠再動水溫 1–2°C。"},
  {tag:"焙度",t:"淺焙用熱一點的水",p:"淺焙豆密度高、細胞壁硬，比較難萃取，常用 92–94°C。深焙豆多孔易溶，降到 86–89°C 可以少一點焦苦。"},
  {tag:"處理法",t:"水洗 vs 日曬 vs 蜜處理",p:"水洗：乾淨明亮的酸。日曬：果醬、莓果與發酵甜感。蜜處理：保留部分果膠曬乾，甜感與酸質介於兩者之間。"},
  {tag:"處理法",t:"厭氧發酵豆的脾氣",p:"厭氧豆風味很外放，容易萃出酒感或過熟水果味。水溫可比同焙度降 1°C，研磨略粗一點會更乾淨。"},
  {tag:"比例",t:"1:15 和 1:16 差在哪？",p:"30g 粉配 450g 水（1:15）口感較濃郁厚實；配 480g（1:16）比較清爽透亮，適合花香調的淺焙。"},
  {tag:"保存",t:"咖啡豆怕的四件事",p:"光、熱、氧氣、濕氣。用有單向排氣閥的袋子或密封罐放陰涼處。冰箱進進出出會反潮，反而更容易走味。"},
  {tag:"保存",t:"養豆期",p:"剛烘好的豆子排氣旺盛，悶蒸會冒很多泡、味道不穩。淺焙通常養 7–14 天、深焙 3–7 天後比較好沖。"},
  {tag:"水",t:"水也是配方的一部分",p:"建議用 TDS 約 75–150 ppm 的軟水。RO 純水萃不出味道，太硬的水會讓酸質變鈍。"},
  {tag:"豆種",t:"藝伎（Geisha）",p:"源自衣索比亞 Gesha 村，2004 年在巴拿馬翡翠莊園的比賽一戰成名，以茉莉花與佛手柑香氣聞名。"},
  {tag:"豆種",t:"SL28 / SL34",p:"肯亞代表品種，由 Scott Laboratories 選育。常見黑醋栗、番茄般的鮮明酸質與多汁口感。"},
  {tag:"萃取",t:"粉床中心的小凹槽",p:"30g 大粉量粉層深，中心最厚、最難濕透。倒粉後在中心輕壓一個淺凹，悶蒸時水更容易均勻擴散。"},
];

/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = sec => { sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0"); };
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const uid = ()=> "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today = ()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};

function beanSvg(roast,size=56,mood="happy"){
  const c = ROAST_COLOR[roast]||"#8F5635";
  const mouth = mood==="sleep" ? '<path d="M25 38 q5 3 10 0" stroke="#3A1E14" stroke-width="2.2" fill="none" stroke-linecap="round"/>'
    : '<path d="M24 36 q6 6 12 0" stroke="#3A1E14" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
  return `<svg width="${size}" height="${size}" viewBox="0 0 60 60" aria-hidden="true">
    <ellipse cx="30" cy="33" rx="21" ry="24" fill="${c}"/>
    <ellipse cx="23" cy="22" rx="7" ry="5" fill="#fff" opacity=".18"/>
    <path d="M30 10 C24 22 36 40 30 56" stroke="#2E160D" stroke-opacity=".35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="22" cy="30" r="2.6" fill="#2A140C"/><circle cx="38" cy="30" r="2.6" fill="#2A140C"/>
    <circle cx="21" cy="29" r=".9" fill="#fff"/><circle cx="37" cy="29" r=".9" fill="#fff"/>
    <ellipse cx="17" cy="36" rx="3.4" ry="2.2" fill="#FF8FA4" opacity=".75"/>
    <ellipse cx="43" cy="36" rx="3.4" ry="2.2" fill="#FF8FA4" opacity=".75"/>
    ${mouth}</svg>`;
}
const cupSvg = `<svg class="deco" width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
  <path d="M14 34h44v18a20 20 0 0 1-20 20h-4a20 20 0 0 1-20-20z" fill="#FFFFFF" opacity=".85"/>
  <path d="M58 40h6a8 8 0 0 1 0 16h-7" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="5" fill="none"/>
  <circle cx="28" cy="50" r="2" fill="#4A2C22"/><circle cx="44" cy="50" r="2" fill="#4A2C22"/>
  <path d="M32 56q4 4 8 0" stroke="#4A2C22" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M28 26q-4-6 0-12M40 26q-4-6 0-12" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;

/* ---------- recipe estimator (no AI needed) ---------- */
function estimateRecipe(b){
  const i = Math.max(0, ROASTS.indexOf(b.roast)); // 0 light .. 4 dark
  let clicks = [49,51,53,55,56][i];
  let temp = [93,92,91,89,87][i];
  const ratio = i<=1 ? 16 : 15;
  const water = DOSE*ratio;
  const proc = String(b.process||"");
  if(/厭氧|日曬|酒|發酵/.test(proc)){ temp-=1; clicks+=1; }
  const bloom = i>=3 ? 60 : 70;
  const p1 = Math.round(water*0.44/10)*10;  // ~200 / 210
  const p2 = Math.round(water*0.75/10)*10;  // ~340 / 360
  return {
    clicks, stdClicks:Math.round(clicks/2), temp, ratio, water,
    totalTime: i<=1 ? "3:00 - 3:20" : "2:50 - 3:10",
    pours:[
      {name:"悶蒸 (Bloom)",add:bloom,total:bloom,from:0,to:40,how:"由中心向外柔和繞圈注水，確認底層完全濕潤無乾粉，靜置觀察排氣膨脹。",why:"徹底排出二氧化碳，打開咖啡粉微孔以利後續萃取。"},
      {name:"第 1 段注水",add:p1-bloom,total:p1,from:40,to:80,how:"中心小圈至中圈穩定細水流注入，維持柔和對流，不沖刷濾紙邊緣。",why:"酸甜核心萃取：帶出主要花果芳香與明亮酸質。"},
      {name:"第 2 段注水",add:p2-p1,total:p2,from:80,to:125,how:"中等水流穩定繞圈，適度增加擾動，把粉層維持在理想水位。",why:"層次與主體擴展：釋放中段甜感、焦糖化物質與厚實體脂感。"},
      {name:"第 3 段注水",add:water-p2,total:water,from:125,to:160,how:"中心定點或極小圈穩健注水補足；水位將露出粉層時直接移開濾杯。",why:"甜感收尾與雜味截斷：避免末段萃出木質澀味與苦雜味。"}
    ],
    flavor:{
      fragrance: b.notes ? `依描述預期：${b.notes}` : "研磨後先聞一下，記下你的第一印象吧！",
      aroma: i<=1 ? "花香、柑橘或莓果調性較明顯" : i===2 ? "堅果、焦糖與水果甜香" : "可可、烤堅果、黑糖",
      acidity: i<=1 ? "明亮、清晰的果酸" : i===2 ? "柔和圓潤的酸" : "低酸、平穩",
      body: i<=1 ? "輕盈透亮、茶感" : i===2 ? "中等醇厚、甜感飽滿" : "厚實、黏稠的巧克力感",
      aftertaste: i<=1 ? "乾淨、回甘帶花香" : i===2 ? "甜感延續中等" : "長、帶可可與微苦回甘"
    },
    dialIn:{
      under:"入口尖酸、寡淡、水感重（萃取不足）：研磨調細 2–3 響，或水溫提高 1–2°C。",
      over:"入口乾澀、焦苦、雜味重（過度萃取）：研磨調粗 2–4 響，或最後一段提早 10–15g 移開濾杯。"
    },
    source:"estimate"
  };
}

function normalizeRecipe(r, b){
  const base = estimateRecipe(b);
  if(!r || typeof r!=="object") return base;
  const out = Object.assign({}, base, r);
  out.clicks = Number(out.clicks)||base.clicks;
  out.stdClicks = Number(out.stdClicks)||Math.round(out.clicks/2);
  out.temp = Number(out.temp)||base.temp;
  out.ratio = Number(out.ratio)||base.ratio;
  out.water = Number(out.water)||DOSE*out.ratio;
  out.pours = Array.isArray(r.pours)&&r.pours.length ? r.pours.slice(0,6).map((p,k)=>({
    name:String(p.name||base.pours[k]?.name||("第 "+k+" 段")), add:Number(p.add)||0, total:Number(p.total)||0,
    from:Number(p.from)||0, to:Number(p.to)||0, how:String(p.how||""), why:String(p.why||"")
  })) : base.pours;
  out.flavor = Object.assign({}, base.flavor, r.flavor||{});
  out.dialIn = Object.assign({}, base.dialIn, r.dialIn||{});
  return out;
}

/* ---------- storage: shared db, falls back to this browser ---------- */
let beans = [];
let ready = false;
let store = { mode:"local",
  async save(b){ const i=beans.findIndex(x=>x.id===b.id); if(i>=0) beans[i]=b; else beans.push(b); writeLocal(); render(); },
  async remove(id){ beans=beans.filter(x=>x.id!==id); writeLocal(); render(); } };
function readLocal(){ try{ const v=JSON.parse(localStorage.getItem("beanbook.beans")||"[]"); return Array.isArray(v)?v:[]; }catch(e){ return []; } }
function writeLocal(){ try{ localStorage.setItem("beanbook.beans",JSON.stringify(beans)); }catch(e){} }

let sample = null;
let canWrite = true;

async function boot(){
  render();
  const c = window.claude;
  const [db, smp, user] = await Promise.all([
    c?.use ? c.use("db").catch(()=>null) : null,
    c?.use ? c.use("sample").catch(()=>null) : null,
    c?.use ? c.use("user").catch(()=>null) : null,
  ]);
  sample = smp;
  if(user){ try{ const w = await user.can("data.write"); if(w===false) canWrite=false; }catch(e){} }
  if(db){
    const col = db.collection("beans");
    store = { mode:"db",
      async save(b){ const {id,...data}=b; await col.doc(id).set(data); },
      async remove(id){ await col.doc(id).delete(); } };
    col.onSnapshot(snap=>{
      beans = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      ready = true; render();
    }, ()=>{ toast("連線中斷，請重新整理頁面"); });
  } else {
    beans = readLocal(); ready = true; render();
  }
}

  ui.tab=tab; ui.view=view; ui.beanId=beanId; ui.msg="";

function beanById(id){ return beans.find(b=>b.id===id); }
function sorted(){ return beans.slice().sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||""))); }
function avgRating(b){ const l=(b.logs||[]).filter(x=>x.rating); return l.length? (l.reduce((s,x)=>s+Number(x.rating),0)/l.length):0; }

let tt=null;
function toast(m){ let el=$("#toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el);} el.textContent=m; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>{el.hidden=true;},2200); }

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", t.dataset.tab===ui.tab?"page":"false"));
  const app=$("#app");
  if(ui.tab==="home"){
    if(ui.view==="detail" && beanById(ui.beanId)) app.innerHTML=viewDetail(beanById(ui.beanId));
    else if(ui.view==="form") app.innerHTML=viewForm();
    else { ui.view="list"; app.innerHTML=viewList(); }
  } else if(ui.tab==="timer") app.innerHTML=viewTimer();
  else app.innerHTML=viewKnow();
  if(ui.tab==="timer") paintTimer();
}

function viewTimer(){
  const b=timerBean();
  if(!b) return `${header()}<div class="empty" style="margin-top:12px">${beanSvg("中焙",64,"sleep")}<h3>先新增一支豆子</h3><p class="muted small">計時器會依那支豆子的配方，告訴你每一段該注到幾克。</p></div>`;
  T.beanId=b.id;
  const r=normalizeRecipe(b.recipe,b);
  return `${header()}<div class="stack" style="margin-top:10px">
    <label class="field"><span>沖哪一支？</span><select class="inp" id="t-bean">${sorted().map(x=>`<option value="${esc(x.id)}" ${x.id===b.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
    <div class="row small muted num"><span class="chip pink">${esc(r.clicks)} clicks</span><span class="chip butter">${esc(r.temp)}°C</span><span class="chip mint">${DOSE}g → ${esc(r.water)}g</span><span class="chip">目標 ${esc(r.totalTime)}</span></div>
    <div class="clock">
      <div class="big num" id="t-clock">0:00</div>
      <div class="cur" id="t-cur">準備好就按開始</div>
      <div class="tgt" id="t-tgt">先預熱濾杯，倒入 ${DOSE}g 粉</div>
      <div class="bar" id="t-bar">${r.pours.map(()=>"<i><span></span></i>").join("")}</div>
      <div class="nextup" id="t-next"></div>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn primary" data-act="t-toggle" id="t-toggle" style="min-width:130px">${T.running?"暫停":T.elapsed?"繼續":"開始"}</button>
      <button class="btn ghost" data-act="t-reset" id="t-reset">重來</button>
    </div>
    <div class="stack" style="gap:8px">${r.pours.map((p,k)=>`<div class="note small row" id="t-row-${k}" style="justify-content:space-between"><span><b>${esc(p.name)}</b> · <span class="num">${fmt(p.from)}–${fmt(p.to)}</span></span><span class="num">累計 <b>${esc(p.total)}g</b></span></div>`).join("")}</div>
  </div>`;
}
function curElapsed(){ return T.running ? T.elapsed + (performance.now()-T.start)/1000 : T.elapsed; }
function paintTimer(){
  const b=timerBean(); if(!b||ui.tab!=="timer") return;
  const r=normalizeRecipe(b.recipe,b); const e=curElapsed();
  const ck=$("#t-clock"); if(!ck) return;
  ck.textContent=fmt(e);
  let idx=r.pours.findIndex(p=>e>=p.from && e<p.to);
  const last=r.pours[r.pours.length-1];
  const cur=$("#t-cur"), tgt=$("#t-tgt"), nx=$("#t-next");
  if(!T.running && e===0){ /* idle text stays */ }
  else if(idx>=0){
    const p=r.pours[idx];
    cur.textContent=p.name;
    tgt.innerHTML=`注到 <b>${esc(p.total)}</b> g <span class="muted small">（這段 +${esc(p.add)}g，剩 ${Math.ceil(p.to-e)} 秒）</span>`;
    const n=r.pours[idx+1]; nx.textContent=n?`下一段 ${fmt(n.from)}：${n.name} → ${n.total}g`:"最後一段：水位快見粉層就移開濾杯";
  } else if(e>=last.to){
    cur.textContent="等待滴濾完成";
    tgt.innerHTML=`目標總時間 <b style="font-size:22px">${esc(r.totalTime)}</b>`;
    nx.textContent="滴完後搖一搖分享壺，先聞濕香再喝！";
  }
  if(idx!==T.lastStep && T.running){ T.lastStep=idx; if(idx>=0) beep(); }
  document.querySelectorAll("#t-bar i span").forEach((s,k)=>{ const p=r.pours[k]; s.style.width=(clamp((e-p.from)/(p.to-p.from),0,1)*100)+"%"; });
  r.pours.forEach((p,k)=>{ const row=$("#t-row-"+k); if(row) row.style.outline = k===idx?"2px solid var(--accent)":"none"; });
  if(T.running) T.raf=requestAnimationFrame(paintTimer);
}
function beep(){ try{ T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)(); const o=T.ac.createOscillator(),g=T.ac.createGain(); o.frequency.value=880; g.gain.setValueAtTime(.15,T.ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,T.ac.currentTime+.35); o.connect(g).connect(T.ac.destination); o.start(); o.stop(T.ac.currentTime+.36);}catch(e){} }
async function lockWake(on){ try{ if(on && navigator.wakeLock){ T.wake=await navigator.wakeLock.request("screen"); } else if(!on && T.wake){ await T.wake.release(); T.wake=null; } }catch(e){} }

/* ---------- AI recipe ---------- */
function aiPrompt(b){
  return `你是一位具備 SCA 萃取理論標準的專業手沖咖啡師。使用者固定使用 30g 咖啡豆大粉量沖煮，器具為 Comandante C40 手搖磨豆機（已裝 Red Clix 紅軸，每響 15 微米，格數是原廠的兩倍；30g 大粉量一般落在 48–56 clicks，依焙度微調）與 HARIO V60 玻璃濾杯（需預熱 15–20 秒）。
請依這支豆子的物理特性（豆質硬度、密度、脫水度、排氣量）設計配方：
豆名：${b.name||""}
產區：${b.origin||"未提供"}
處理法：${b.process||"未提供"}
焙度：${b.roast||"未提供"}
烘豆商：${b.roaster||"未提供"}
風味描述：${b.notes||"未提供"}

規則：粉水比 15 或 16（總水量 450 或 480g）。pours 固定 4 段：悶蒸（60–80g，0 秒開始，停留 35–45 秒）、第1段、第2段、第3段注水至總水量；from/to 為秒數，total 為累計克數，add 為該段注水量。用繁體中文、口吻親切。
只回覆一個 JSON 物件，格式：
{"clicks":52,"stdClicks":26,"temp":91,"ratio":15,"water":450,"totalTime":"2:50 - 3:20",
"pours":[{"name":"悶蒸 (Bloom)","add":70,"total":70,"from":0,"to":40,"how":"操作要點與擾動手法","why":"萃取目標與物理意義"},{"name":"第 1 段注水",...},{"name":"第 2 段注水",...},{"name":"第 3 段注水",...}],
"flavor":{"fragrance":"乾香","aroma":"濕香","acidity":"前段酸質","body":"中段風味、甜感與質地","aftertaste":"餘韻"},
"dialIn":{"under":"萃取不足時的調整（含具體 clicks 與水溫）","over":"過度萃取時的調整"},
"tip":"一則與這支豆子的產區、品種或處理法有關的咖啡小知識，60 字內"}`;
}
async function aiRecipe(b){
  const j = await sample.json(aiPrompt(b), {modelTier:"default"});
  const r = normalizeRecipe(j,b); r.source="claude";
  return {recipe:r, tip: typeof j?.tip==="string"? j.tip : ""};
}
const ERR = {not_granted:"沒有取得使用 Claude 的許可，先用快速估算吧。",rate_limited:"Claude 有點忙，稍後再試一次。",invalid_json:"Claude 的回覆格式不對，再試一次看看。",sampling_disabled:"這個帳號無法使用 Claude。",session_expired:"請重新登入 Claude 後再試。"};
const errMsg = e => ERR[e?.code] || "Claude 暫時沒有回應，請稍後再試。";

/* ---------- form helpers ---------- */
function newForm(b){
  return b ? {id:b.id,name:b.name||"",origin:b.origin||"",roaster:b.roaster||"",process:b.process||"",roast:b.roast||"中焙",notes:b.notes||"",recipe:normalizeRecipe(b.recipe,b)}
           : {id:null,name:"",origin:"",roaster:"",process:"水洗",roast:"淺中焙",notes:"",recipe:null};
}
function readForm(){
  const f=ui.form; const v=id=>{const el=$("#"+id); return el?el.value.trim():"";};
  f.name=v("f-name"); f.origin=v("f-origin"); f.roaster=v("f-roaster"); f.process=v("f-process"); f.notes=v("f-notes");
  if(f.recipe && $("#r-clicks")){
    const r=f.recipe;
    const nc=Number(v("r-clicks"))||r.clicks, nt=Number(v("r-temp"))||r.temp, nr=Number(v("r-ratio"))||r.ratio, ntime=v("r-time")||r.totalTime;
    const tot=r.pours.slice(0,4).map((p,k)=>Number(v("r-p"+k))||p.total);
    const changed = nc!==r.clicks||nt!==r.temp||nr!==r.ratio||ntime!==r.totalTime||tot.some((t,k)=>t!==r.pours[k].total);
    r.clicks=nc; r.stdClicks=Math.round(nc/2); r.temp=nt; r.ratio=nr; r.totalTime=ntime;
    if(nr*DOSE!==r.water){ r.water=nr*DOSE; tot[3]=r.water; }
    r.pours.forEach((p,k)=>{ if(k<4){ p.total=tot[k]; p.add=tot[k]-(k?tot[k-1]:0);} });
    if(changed) r.source="manual";
  }
  return f;
}
function beanFromForm(f, recipe, tip){
  const old=f.id?beanById(f.id):null;
  return Object.assign({}, old||{}, {
    id:f.id||uid(), name:f.name||"未命名的豆子", origin:f.origin, roaster:f.roaster, process:f.process, roast:f.roast, notes:f.notes,
    recipe, tip: tip!=null? tip : (old?.tip||""), createdAt: old?.createdAt||new Date().toISOString(), logs: old?.logs||[], example:false
  });
}
async function persist(b){
  try{ await store.save(b); return true; }
  catch(e){ ui.msg = e?.code==="quota_exceeded"?"豆櫃滿了，刪掉幾支舊豆子再試。":"儲存失敗，請檢查連線後再試。"; ui.msgErr=true; render(); return false; }
}

/* ---------- log sheet ---------- */
function openLog(b){
  const r=normalizeRecipe(b.recipe,b);
  const L={rating:4};
  const layer=$("#layer");
  const draw=()=>{ layer.innerHTML=`<div class="scrim" data-act="close-sheet"><div class="sheet stack" role="dialog" aria-modal="true" aria-label="記一杯">
    <div class="row" style="justify-content:space-between"><h2>記一杯 · ${esc(b.name)}</h2><button class="iconbtn" data-act="close-sheet" aria-label="關閉">✕</button></div>
    <div class="field"><span>好喝程度</span><div class="cupsel">${[1,2,3,4,5].map(n=>`<button type="button" data-act="rate" data-v="${n}" aria-pressed="${n<=L.rating}" aria-label="${n} 分">☕</button>`).join("")}</div></div>
    <div class="grid2">
      <label class="field"><span>實際 clicks</span><input class="inp num" id="l-clicks" type="number" inputmode="numeric" value="${esc(r.clicks)}"></label>
      <label class="field"><span>水溫 °C</span><input class="inp num" id="l-temp" type="number" inputmode="numeric" value="${esc(r.temp)}"></label>
      <label class="field"><span>總時間</span><input class="inp num" id="l-time" placeholder="3:05" value="${T.beanId===b.id&&T.elapsed?fmt(T.elapsed):""}"></label>
      <label class="field"><span>日期</span><input class="inp num" id="l-date" type="date" value="${today()}"></label>
    </div>
    <label class="field"><span>喝起來怎麼樣？</span><textarea class="inp" id="l-note" placeholder="例：前段水蜜桃很明顯，尾段有點澀，下次粗 2 響"></textarea></label>
    <button class="btn primary block" data-act="save-log" id="save-log">存下這一杯</button>
  </div></div>`; };
  draw();
  layer.onclick=async ev=>{
    const t=ev.target.closest("[data-act]"); if(!t) return;
    const a=t.dataset.act;
    if(a==="close-sheet" && (t===ev.target || t.classList.contains("iconbtn"))){ layer.innerHTML=""; layer.onclick=null; }
    else if(a==="rate"){ L.rating=Number(t.dataset.v); layer.querySelectorAll(".cupsel button").forEach(x=>x.setAttribute("aria-pressed", Number(x.dataset.v)<=L.rating)); }
    else if(a==="save-log"){
      const v=id=>$("#"+id).value.trim();
      const entry={date:v("l-date")||today(),rating:L.rating,clicks:Number(v("l-clicks"))||null,temp:Number(v("l-temp"))||null,time:v("l-time"),note:v("l-note")};
      const nb=Object.assign({},b,{logs:[...(b.logs||[]),entry]});
      t.disabled=true;
      if(await persist(nb)){ layer.innerHTML=""; layer.onclick=null; toast("記下來了！"); }
      else t.disabled=false;
    }
  };
}

/* ---------- events ---------- */
document.addEventListener("input",ev=>{
  if(ev.target.id==="q"){ ui.q=ev.target.value; const pos=ev.target.selectionStart; render(); const q=$("#q"); if(q){ q.focus(); try{q.setSelectionRange(pos,pos);}catch(e){} } }
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="t-bean"){ cancelAnimationFrame(T.raf); T.beanId=ev.target.value; T.running=false; T.elapsed=0; T.lastStep=-1; render(); }
});
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-act],[data-tab]"); if(!t || t.closest("#layer")) return;
  if(t.dataset.tab){ go(t.dataset.tab); return; }
  const a=t.dataset.act, id=t.dataset.id;
  if(a!=="del") ui.confirmDel=null;
  switch(a){
    case "tip-next": ui.tipIdx=(ui.tipIdx+1)%KNOW.length; render(); break;
    case "open": go("home","detail",id); break;
    case "back": { const backId = ui.view==="form" && ui.form?.id && beanById(ui.form.id) ? ui.form.id : null;
      ui.form=null; ui.busy=false; go("home", backId?"detail":"list", backId); break; }
    case "new": ui.form=newForm(null); go("home","form"); break;
    case "edit": ui.form=newForm(beanById(id)); ui.tab="home"; ui.view="form"; ui.msg=""; render(); window.scrollTo(0,0); break;
    case "proc": readForm(); ui.form.process=t.dataset.v; render(); break;
    case "roast": readForm(); ui.form.roast=t.dataset.v; if(ui.form.recipe && !ui.form.id){ui.form.recipe=null;} render(); break;
    case "quick-save": {
      const f=readForm(); if(!f.name){ ui.msg="先幫豆子取個名字吧！"; ui.msgErr=true; render(); return; }
      const recipe=f.recipe||estimateRecipe(f);
      const b=beanFromForm(f,recipe,null);
      if(await persist(b)){ ui.form=null; toast("放進豆櫃了！"); go("home","detail",b.id); }
      break; }
    case "ai-save": {
      const f=readForm(); if(!f.name){ ui.msg="先幫豆子取個名字吧！"; ui.msgErr=true; render(); return; }
      ui.busy=true; ui.msg="Claude 正在依豆況推算刻度與注水策略，大約需要半分鐘…"; ui.msgErr=false; render();
      try{ const {recipe,tip}=await aiRecipe(f); const b=beanFromForm(f,recipe,tip); ui.busy=false; ui.msg="";
        if(await persist(b)){ ui.form=null; toast("配方完成！"); go("home","detail",b.id); } }
      catch(e){ ui.busy=false; ui.msg=errMsg(e); ui.msgErr=true; render(); }
      break; }
    case "regen": {
      const b=beanById(id); if(!b||ui.busy) return;
      ui.busy=true; ui.msg="Claude 正在重新設計配方…"; ui.msgErr=false; render();
      try{ const {recipe,tip}=await aiRecipe(b); ui.busy=false; ui.msg="";
        if(await persist(Object.assign({},b,{recipe,tip:tip||b.tip,example:false}))) toast("配方更新了！"); render(); }
      catch(e){ ui.busy=false; ui.msg=errMsg(e); ui.msgErr=true; render(); }
      break; }
    case "del":
      if(ui.confirmDel===id){ ui.confirmDel=null; try{ await store.remove(id); toast("已刪除"); go("home"); }catch(e){ ui.msg="刪除失敗，請稍後再試。"; ui.msgErr=true; render(); } }
      else { ui.confirmDel=id; render(); }
      break;
    case "log": openLog(beanById(id)); break;
    case "brew": T.beanId=id; T.running=false; T.elapsed=0; T.lastStep=-1; go("timer"); break;
    case "t-toggle":
      if(T.running){ T.elapsed=curElapsed(); T.running=false; cancelAnimationFrame(T.raf); lockWake(false); }
      else { T.start=performance.now(); T.running=true; lockWake(true); beep(); T.lastStep=-2; }
      t.textContent=T.running?"暫停":"繼續"; paintTimer(); break;
    case "t-reset": cancelAnimationFrame(T.raf); T.running=false; T.elapsed=0; T.lastStep=-1; lockWake(false); render(); break;
  }
});

boot();
})();
</script>
</body>
</html>
